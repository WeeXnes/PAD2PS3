; PlatformIO Project Configuration File for ESP32-S3 PS3 Controller Emulator
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Documentation: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Target ESP32-S3 configuration
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB

; Serial monitor and upload baud rates
monitor_speed = 115200
upload_speed = 921600

; USB Device Settings for ESP32-S3 Native USB (OTG):
; - Remove default HW CDC/JTAG mode (-DARDUINO_USB_MODE=1)
; - ARDUINO_USB_MODE=0: Native USB OTG (TinyUSB stack enabled for custom HID)
; - ARDUINO_USB_CDC_ON_BOOT=0: Prevents framework from auto-starting TinyUSB with Espressif defaults
; - Sets Board and Manufacturer strings to Sony PLAYSTATION(R)3 Controller
build_unflags = 
    -DARDUINO_USB_MODE=1

build_flags = 
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D USB_PRODUCT='"PLAYSTATION(R)3 Controller"'
    -D USB_MANUFACTURER='"Sony"'
    -D CORE_DEBUG_LEVEL=3
